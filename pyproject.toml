[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-nlp-sentiment"
version = "0.2.0"
description = "Financial sentiment classification with classical NLP and FinBERT."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
data = ["datasets>=2.19"]
transformers = ["transformers>=4.40", "torch>=2.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
app = ["streamlit>=1.33"]
plots = ["matplotlib>=3.8"]
all = [
    "datasets>=2.19",
    "transformers>=4.40",
    "torch>=2.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.33",
    "matplotlib>=3.8",
    "pytest>=7.4"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
